name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilation via PyInstaller
        run: |
          pyinstaller build_config.spec --clean --noconfirm

      - name: Verification de l'artefact
        run: |
          if (!(Test-Path "dist/MarquageData-Desktop.exe")) { throw "Executable non genere" }

      - name: Upload de l'artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: MarquageData-Desktop-windows
          path: dist/MarquageData-Desktop.exe
          retention-days: 30

      - name: Publication en Release (sur tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MarquageData-Desktop.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
